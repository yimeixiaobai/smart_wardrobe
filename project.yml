name: SmartWardrobe
options:
  bundleIdPrefix: com.smartwardrobe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSCameraUsageDescription: "需要访问相机来拍摄衣物照片"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册来选择衣物照片"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用于获取当前天气信息，提供更精准的穿搭推荐"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  SmartWardrobe:
    type: application
    platform: iOS
    sources:
      - path: SmartWardrobe
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ZIPFoundation
    info:
      path: SmartWardrobe/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartwardrobe.app
        INFOPLIST_KEY_CFBundleDisplayName: "智能衣橱"

  SmartWardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartWardrobeTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SmartWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartwardrobe.tests
        GENERATE_INFOPLIST_FILE: YES
